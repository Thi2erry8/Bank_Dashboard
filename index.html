<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Bank Dashboard - HBank | devChallenges.io</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #43454d;
      }

      .author-info {
        font-size: 14px;
        text-align: center;
        margin-top: 16px;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <!-- 

      Ethan Sutcliffe
      
      Dashboard
      
      Analytics
      
      Performance
      
      Hotjar
      
      New
      
      Support
      
      Tickets
      
      Agents
      
      Customers
      
      Products
      
      Orders
      
      Reports
      
      Settings
      
      Logout
      
      Inventory Details
      
      Your balance
      
      $25,330
      
      3 cards
      
      Details
      
      Shopping Card
      
      NAME
      
      **** **** 0928
      
      **** **** 4486
      
      Exp 26/6
      
      Add Card
      
      Card details
      
      **** **** 7800
      
      Card number
      
      **** 1234 4567 7800
      
      Expire date
      
      08/28
      
      cvv
      
      Level
      
      Spending limits
      
      Daily Transaction Limit
      
      $400 spent of $2000
      
      Earnings
      
      $12,341
      
      Spendings
      
      $4,009
      
      Goals
      
      $8,098
     -->
    <header
      class="w-full border border-transparent border-b-neutral-400 h-[10vh] flex flex-row justify-between items-center px-8"
    >
      <img class="h-[40px]" src="./resources/hbank-logo.svg" alt="hbank-logo" />

      <div class="flex flex-row gap-3 items-center">
        <img src="./resources/avatar.png" alt="" />
        <p class="text-neutral-200">Ethan Sutcliffe</p>
      </div>
    </header>

    <!--MAIN-->
    <main class="flex flex-row">
      <!--SIDEDBAR-->
      <div
        class="w-1/5 border border-transparent border-r-neutral-400 h-[91vh] flex flex-col justify-between"
      >
        <ul class="text-neutral-200 font-medium flex flex-col gap-2 pl-4 pt-4">
          <li class="flex gap-2 font-medium">
            <i class="ri-home-4-line"></i>
            <p>Dashboard</p>
          </li>

          <h3 class="text-neutral-400 my-4">Analytics</h3>

          <li class="flex gap-2 font-medium">
            <i class="ri-line-chart-line"></i>
            <p>Performance</p>
          </li>

          <li class="flex gap-2 font-medium items-center">
            <i class="ri-focus-2-line"></i>
            <p>Hotjar</p>
            <span
              class="bg-neutral-100 text-neutral-700 text-xs px-1 rounded-lg ml-14"
              >New</span
            >
          </li>

          <h3 class="text-neutral-400 my-4">Support</h3>

          <li class="flex gap-2 font-medium items-center">
            <i class="ri-coupon-3-line"></i>
            <p>Tickets</p>
            <span
              class="bg-neutral-500 text-neutral-200 text-xs px-2 rounded-lg ml-14"
              >18</span
            >
          </li>

          <li class="flex gap-2 font-medium items-center">
            <i class="ri-user-line"></i>
            <p>Agents</p>
          </li>

          <li class="flex gap-2 font-medium items-center">
            <i class="ri-group-line"></i>
            <p>Customers</p>
          </li>

          <h3 class="text-neutral-400 my-4">Support</h3>

          <li class="flex gap-2 font-medium items-center">
            <i class="ri-store-line"></i>
            <p>Product</p>
          </li>

          <li class="flex gap-2 font-medium items-center">
            <i class="ri-shopping-basket-2-line"></i>
            <p>Orders</p>
          </li>

          <li class="flex gap-2 font-medium items-center">
            <i class="ri-information-line"></i>
            <p>Reports</p>
          </li>
        </ul>

        <div class="text-neutral-200 font-medium pl-4 pt-4">
          <div class="flex gap-2 font-medium">
            <i class="ri-settings-3-line"></i>
            <p>Settings</p>
          </div>

          <div class="flex gap-2 font-medium">
            <i class="ri-logout-box-r-line"></i>
            <p>Logout</p>
          </div>
        </div>
      </div>
      <section class="min-h-screen"></section>
    </main>
  </body>
</html>
